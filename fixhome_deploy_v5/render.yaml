services:
  - type: web
    name: fixhome-web
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.enableCORS false --server.enableXsrfProtection true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fixhome-db
          property: connectionString
      - key: FIXHOME_SEED_DEMO
        value: "0"
      - key: FIXHOME_ENABLE_VISION_AI
        value: "0"
      - key: FIXHOME_ADMIN_EMAIL
        value: admin@fixhome.id.vn
      - key: FIXHOME_ADMIN_NAME
        value: Quản trị FixHome
      - key: FIXHOME_ADMIN_PHONE
        sync: false
      - key: FIXHOME_ADMIN_PASSWORD
        sync: false
    disk:
      name: fixhome-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

databases:
  - name: fixhome-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: fixhome
    user: fixhome
    diskSizeGB: 15
    postgresMajorVersion: "18"
    ipAllowList: []
